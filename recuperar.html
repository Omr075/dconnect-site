<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta
        name="author"
        content="Daúdo Omar"
    >

    <meta
        name="description"
        content="Recuperação de palavra-passe do mozapi.com"
    >

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="keywords"
        content="api, mozapi, recuperação, palavra-passe"
    >

    <title>mozapi/recuperar</title>

    <link
        rel="stylesheet"
        href="css/recuperar.css"
    >

</head>


<body>


<a
    href="index.html"
    class="nav-brand"
>

    <img
        src="assets/img/logo.jpeg"
        alt="MozAPI Logo"
    >

</a>


<main class="recovery-container">


    <!-- =================================================
         PASSO 1
    ================================================== -->

    <section
        id="stepPhone"
        class="recovery-step active"
    >

        <h1 class="recovery-title">
            Recuperar palavra-passe
        </h1>


        <p class="recovery-description">
            Introduza o número associado à sua conta.
        </p>


<div class="botoes-card">

    <button
        class="botoes"
        onclick="window.location.href='recuperar-email.html'"
    >
        Email
    </button>
ou
    <button
        class="botoes"
        onclick="window.location.href='recuperar.html'"
    >
        SMS
    </button>

</div>

        <div class="recovery-card">

            <form
                id="phoneForm"
                class="recovery-form"
            >

                <div class="form-group">

                    <label for="phone">
                        Número de telefone
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Ex.: 851234567"
                        autocomplete="tel"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="requestCode"
                    class="primary-button"
                >
                    Enviar código
                </button>

            </form>


            <div
                id="phoneMessage"
                class="recovery-message"
            ></div>

        </div>


        <a
            href="login.html"
            class="back-login"
        >
            Voltar ao login
        </a>

    </section>



    <!-- =================================================
         PASSO 2
    ================================================== -->

    <section
        id="stepCode"
        class="recovery-step"
    >

        <h1 class="recovery-title">
            Verificar código
        </h1>


        <p class="recovery-description">

            Enviámos um código para
            <strong id="phoneDisplay"></strong>.

        </p>


        <div class="recovery-card">

            <form
                id="codeForm"
                class="recovery-form"
            >

                <div class="form-group">

                    <label for="code">
                        Código de recuperação
                    </label>

                    <input
                        type="text"
                        id="code"
                        name="code"
                        inputmode="numeric"
                        maxlength="6"
                        placeholder="000000"
                        autocomplete="one-time-code"
                        required
                    >

                </div>


                <div class="code-timer">

                    <span>
                        Código válido por
                    </span>

                    <strong id="codeTimer">
                        60s
                    </strong>

                </div>


                <button
                    type="submit"
                    id="verifyCode"
                    class="primary-button"
                >
                    Verificar código
                </button>

            </form>


            <div
                id="codeMessage"
                class="recovery-message"
            ></div>


            <button
                type="button"
                id="resendCode"
                class="secondary-button"
                disabled
            >
                Pedir novo código
            </button>

        </div>

    </section>



    <!-- =================================================
         PASSO 3
    ================================================== -->

    <section
        id="stepPassword"
        class="recovery-step"
    >

        <h1 class="recovery-title">
            Nova palavra-passe
        </h1>


        <p class="recovery-description">
            Defina uma nova palavra-passe para a sua conta.
        </p>


        <div class="recovery-card">

            <form
                id="passwordForm"
                class="recovery-form"
            >

                <div class="form-group">

                    <label for="newPassword">
                        Nova palavra-passe
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        name="newPassword"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirmar palavra-passe
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="resetPassword"
                    class="primary-button"
                >
                    Alterar palavra-passe
                </button>

            </form>


            <div
                id="passwordMessage"
                class="recovery-message"
            ></div>

        </div>

    </section>


</main>


<script src="js/recuperar.js"></script>

</body>

</html>
